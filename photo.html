<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드론 사진 파일명 변환</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f3f4f6;color:#111;padding:16px;}
  h1{font-size:18px;font-weight:bold;margin-bottom:4px;}
  .sub{font-size:12px;color:#666;margin-bottom:16px;}

  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px 16px;margin-bottom:14px;}
  .controls label{font-size:13px;font-weight:bold;}
  select{font-size:13px;padding:6px 10px;border:1px solid #ccc;border-radius:6px;}
  button{font-size:13px;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;}
  .btn-load{background:#1a5fb4;color:#fff;}
  .btn-zip{background:#16a34a;color:#fff;font-weight:bold;padding:10px 20px;}
  .btn-zip:disabled{background:#9ca3af;cursor:not-allowed;}

  .status{font-size:12px;color:#555;margin-left:4px;}
  .list{display:flex;flex-direction:column;gap:10px;}

  .card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .card.has-photo{border-color:#16a34a;}
  .card-info{flex:1;min-width:180px;}
  .card-no{font-size:11px;color:#888;margin-bottom:2px;}
  .card-date{font-size:13px;font-weight:bold;color:#1a5fb4;}
  .card-loc{font-size:12px;color:#444;margin-top:2px;}
  .card-filename{font-size:11px;color:#16a34a;margin-top:4px;font-family:monospace;word-break:break-all;}
  .cloud-badge{font-size:10px;background:#dcfce7;color:#15803d;border-radius:4px;padding:2px 6px;margin-top:3px;display:inline-block;}

  .card-upload{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .upload-btn{background:#f3f4f6;border:1.5px dashed #aaa;border-radius:8px;padding:8px 14px;font-size:12px;color:#555;cursor:pointer;text-align:center;white-space:nowrap;}
  .upload-btn:hover{background:#e5e7eb;}
  input[type="file"]{display:none;}

  .thumb-wrap{position:relative;}
  .thumb{width:70px;height:70px;object-fit:cover;border-radius:6px;border:2px solid #16a34a;display:block;}
  .thumb-del{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

  .upload-status{font-size:10px;margin-top:2px;max-width:90px;word-break:break-all;text-align:center;}
  .upload-status.uploading{color:#f59e0b;}
  .upload-status.done{color:#16a34a;}
  .upload-status.error{color:#dc2626;}

  .empty{text-align:center;color:#999;padding:40px;font-size:13px;}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .count-badge{background:#1a5fb4;color:#fff;border-radius:20px;padding:3px 10px;font-size:12px;}

  .progress-bar-wrap{width:100%;background:#e5e7eb;border-radius:4px;height:6px;margin-top:4px;display:none;}
  .progress-bar{height:6px;background:#16a34a;border-radius:4px;width:0%;transition:width 0.3s;}
</style>
</head>
<body>

<h1>📷 드론 사진 파일명 변환</h1>
<p class="sub">사진을 선택하면 클라우드에 저장됩니다. 다른 기기에서 불러오기 하면 ZIP 다운로드가 가능합니다.</p>

<div class="controls">
  <label>월 선택</label>
  <select id="sel-year">
    <option value="2025">2025년</option>
    <option value="2026" selected>2026년</option>
    <option value="2027">2027년</option>
  </select>
  <select id="sel-month">
    <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
    <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
    <option value="7" selected>7월</option><option value="8">8월</option><option value="9">9월</option>
    <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
  </select>
  <button class="btn-load" onclick="loadRecords()">불러오기</button>
  <span class="status" id="loadMsg"></span>
</div>

<div class="bar" id="actionBar" style="display:none;">
  <span class="count-badge" id="countBadge">☁️ 업로드 0 / 0</span>
  <button class="btn-zip" id="btnZip" disabled onclick="downloadZip()">📥 ZIP 다운로드</button>
</div>
<div class="progress-bar-wrap" id="progressWrap">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="list" id="list">
  <div class="empty">위에서 월을 선택하고 불러오기를 누르세요.</div>
</div>

<script>
const SUPABASE_URL = "https://fnpsaypaxpxyyqmrqwai.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZucHNheXBheHB4eXlxbXJxd2FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5OTc1NzYsImV4cCI6MjA4OTU3MzU3Nn0.yZir2n-zxnbedVdIKwpqJAnWjuwEp96jIYjOY6cNPe4";
const T_FLIGHTLOG = "drone_flight_log";
const BUCKET = "drone-photos";

let records = [];
let filenames = [];

function getPhotoFilenames(recs) {
  const dateSeq = {};
  return recs.map(r => {
    const dateStr = r.log_datetime ? r.log_datetime.slice(0, 10) : "";
    const mmdd = dateStr.slice(5).replace("-", "");
    const loc = r.flight_location || "";
    dateSeq[dateStr] = (dateSeq[dateStr] || 0) + 1;
    return mmdd ? `${mmdd}.목포.${dateSeq[dateStr]}.${loc}` : `unknown.${r.id}`;
  });
}

function getPublicUrl(storagePath) {
  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${storagePath}`;
}

function hdrs() {
  return { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
}

async function loadRecords() {
  const y = document.getElementById("sel-year").value;
  const m = document.getElementById("sel-month").value;
  const mm = String(m).padStart(2, "0");
  const mInt = parseInt(m);
  const nextY = mInt === 12 ? String(parseInt(y) + 1) : y;
  const nextMm = mInt === 12 ? "01" : String(mInt + 1).padStart(2, "0");

  const msg = document.getElementById("loadMsg");
  msg.textContent = "불러오는 중...";

  try {
    // photo_path 포함해서 불러오기 — 업로드 여부를 DB에서 직접 판단
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${T_FLIGHTLOG}?log_datetime=gte.${y}-${mm}-01&log_datetime=lt.${nextY}-${nextMm}-01` +
      `&select=id,log_datetime,flight_location,pilot_name,photo_path,photo_display_name&order=log_datetime.asc`,
      { headers: hdrs() }
    );
    if (!res.ok) throw new Error(await res.text());
    records = await res.json();
    filenames = getPhotoFilenames(records);

    // photo_path는 있는데 photo_display_name이 없는 경우 → 파일명 복원 후 DB 업데이트
    for (let i = 0; i < records.length; i++) {
      const r = records[i];
      if (r.photo_path && !r.photo_display_name) {
        const ext = r.photo_path.includes(".") ? r.photo_path.slice(r.photo_path.lastIndexOf(".")) : ".jpg";
        const displayName = filenames[i] + ext;
        r.photo_display_name = displayName;
        // 백그라운드로 DB 업데이트 (await 없이)
        fetch(`${SUPABASE_URL}/rest/v1/${T_FLIGHTLOG}?id=eq.${r.id}`, {
          method: "PATCH",
          headers: { ...hdrs(), "Content-Type": "application/json", Prefer: "return=minimal" },
          body: JSON.stringify({ photo_display_name: displayName })
        });
      }
    }

    const uploadedCount = records.filter(r => r.photo_path).length;
    msg.textContent = `${records.length}건 로드됨 (업로드 ${uploadedCount}건)`;
    renderList();
  } catch(e) {
    msg.textContent = "실패: " + e.message;
  }
}

function renderList() {
  const list = document.getElementById("list");
  const bar = document.getElementById("actionBar");

  if (!records.length) {
    list.innerHTML = '<div class="empty">이 달의 비행 기록이 없습니다.</div>';
    bar.style.display = "none";
    return;
  }

  bar.style.display = "flex";

  list.innerHTML = records.map((r, i) => {
    const dt = r.log_datetime || "";
    const datePart = dt.slice(0, 10);
    const timePart = dt.includes("T") ? dt.slice(11, 16) : "";
    const loc = r.flight_location || "-";
    const fname = filenames[i];
    const hasPhoto = !!r.photo_path;
    const thumbSrc = hasPhoto ? getPublicUrl(r.photo_path) : "";

    return `
    <div class="card${hasPhoto ? " has-photo" : ""}" id="card-${r.id}">
      <div class="card-info">
        <div class="card-no">No.${i + 1}${r.pilot_name ? " · " + r.pilot_name : ""}</div>
        <div class="card-date">${datePart}${timePart ? " " + timePart : ""}</div>
        <div class="card-loc">📍 ${loc}</div>
        <div class="card-filename" id="fname-${r.id}">${fname}</div>
        ${hasPhoto ? `<span class="cloud-badge" id="badge-${r.id}">☁️ 업로드됨</span>` : `<span class="cloud-badge" id="badge-${r.id}" style="display:none">☁️ 업로드됨</span>`}
      </div>
      <div class="card-upload">
        <label class="upload-btn" for="file-${r.id}" id="ulabel-${r.id}">${hasPhoto ? "🔄 교체" : "📁 사진 선택"}</label>
        <input type="file" id="file-${r.id}" accept="image/*" data-id="${r.id}" data-idx="${i}" onchange="handleFile(this)">
        <div id="thumb-${r.id}">
          ${hasPhoto ? `<div class="thumb-wrap"><img class="thumb" src="${thumbSrc}" alt="${fname}" onerror="this.style.display='none'"><button class="thumb-del" onclick="deleteFile('${r.id}','${r.photo_path}')" title="삭제">✕</button></div>` : ""}
        </div>
        <div class="upload-status${hasPhoto ? " done" : ""}" id="ustatus-${r.id}">${hasPhoto ? "업로드 완료 ✓" : ""}</div>
      </div>
    </div>`;
  }).join("");

  updateBadge();
}

async function handleFile(input) {
  const id = input.dataset.id;
  const idx = parseInt(input.dataset.idx);
  const fname = filenames[idx];
  const file = input.files[0];
  if (!file) return;

  const ext = "." + (file.name.split(".").pop().toLowerCase() || "jpg");
  const displayName = fname + ext;                      // ZIP 저장용 파일명 (한글 포함)
  const storagePath = `record_${id}${ext}`;             // Storage 키 (ASCII 전용)

  const statusEl = document.getElementById(`ustatus-${id}`);
  statusEl.textContent = "업로드 중...";
  statusEl.className = "upload-status uploading";

  try {
    // 1) Storage 업로드 (upsert)
    const uploadRes = await fetch(
      `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${storagePath}`,
      {
        method: "POST",
        headers: { ...hdrs(), "Content-Type": file.type || "image/jpeg", "x-upsert": "true" },
        body: file
      }
    );
    if (!uploadRes.ok) throw new Error(await uploadRes.text());

    // 2) DB에 photo_path 저장 → 다른 기기에서 불러올 때 사용
    const patchRes = await fetch(
      `${SUPABASE_URL}/rest/v1/${T_FLIGHTLOG}?id=eq.${id}`,
      {
        method: "PATCH",
        headers: { ...hdrs(), "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify({ photo_path: storagePath, photo_display_name: displayName })
      }
    );
    if (!patchRes.ok) throw new Error(await patchRes.text());

    // records 배열 업데이트
    const rec = records.find(r => String(r.id) === String(id));
    if (rec) { rec.photo_path = storagePath; rec.photo_display_name = displayName; }

    statusEl.textContent = "업로드 완료 ✓";
    statusEl.className = "upload-status done";

    // 썸네일 표시
    const thumbEl = document.getElementById(`thumb-${id}`);
    const url = URL.createObjectURL(file);
    thumbEl.innerHTML = `
      <div class="thumb-wrap">
        <img class="thumb" src="${url}" alt="${displayName}">
        <button class="thumb-del" onclick="deleteFile('${id}','${storagePath}')" title="삭제">✕</button>
      </div>`;

    document.getElementById(`badge-${id}`).style.display = "inline-block";
    document.getElementById(`ulabel-${id}`).textContent = "🔄 교체";
    document.getElementById(`card-${id}`).classList.add("has-photo");

    updateBadge();
  } catch(e) {
    statusEl.textContent = "실패: " + e.message;
    statusEl.className = "upload-status error";
  }
}

async function autoDeleteOldPhotos() {
  // 2개월 이전 날짜 계산
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - 2);
  const cutoffStr = cutoff.toISOString().slice(0, 10); // YYYY-MM-DD

  // 2개월 이전이고 photo_path가 있는 레코드 조회
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/${T_FLIGHTLOG}?log_datetime=lt.${cutoffStr}&photo_path=not.is.null&select=id,photo_path`,
    { headers: hdrs() }
  );
  if (!res.ok) return;
  const old = await res.json();
  if (!old.length) return;

  // Storage 일괄 삭제
  const paths = old.map(r => r.photo_path);
  await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`, {
    method: "DELETE",
    headers: { ...hdrs(), "Content-Type": "application/json" },
    body: JSON.stringify({ prefixes: paths })
  });

  // DB photo_path / photo_display_name 초기화
  for (const r of old) {
    await fetch(`${SUPABASE_URL}/rest/v1/${T_FLIGHTLOG}?id=eq.${r.id}`, {
      method: "PATCH",
      headers: { ...hdrs(), "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ photo_path: null, photo_display_name: null })
    });
  }

  console.log(`[자동삭제] 2개월 이전 사진 ${old.length}건 삭제 완료`);
}

async function deleteFile(id, storagePath) {
  if (!confirm("이 사진을 삭제하시겠습니까?")) return;

  // Storage 삭제
  await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`, {
    method: "DELETE",
    headers: { ...hdrs(), "Content-Type": "application/json" },
    body: JSON.stringify({ prefixes: [storagePath] })
  });

  // DB photo_path 초기화
  await fetch(`${SUPABASE_URL}/rest/v1/${T_FLIGHTLOG}?id=eq.${id}`, {
    method: "PATCH",
    headers: { ...hdrs(), "Content-Type": "application/json", Prefer: "return=minimal" },
    body: JSON.stringify({ photo_path: null, photo_display_name: null })
  });

  const rec = records.find(r => String(r.id) === String(id));
  if (rec) { rec.photo_path = null; rec.photo_display_name = null; }

  document.getElementById(`thumb-${id}`).innerHTML = "";
  document.getElementById(`ustatus-${id}`).textContent = "";
  document.getElementById(`ustatus-${id}`).className = "upload-status";
  document.getElementById(`badge-${id}`).style.display = "none";
  document.getElementById(`ulabel-${id}`).textContent = "📁 사진 선택";
  document.getElementById(`card-${id}`).classList.remove("has-photo");
  updateBadge();
}

function updateBadge() {
  const total = records.length;
  const done = records.filter(r => r.photo_path).length;
  document.getElementById("countBadge").textContent = `☁️ 업로드 ${done} / ${total}`;
  document.getElementById("btnZip").disabled = done === 0;
}

async function downloadZip() {
  const btn = document.getElementById("btnZip");
  const progressWrap = document.getElementById("progressWrap");
  const progressBar = document.getElementById("progressBar");

  btn.disabled = true;
  btn.textContent = "다운로드 중...";
  progressWrap.style.display = "block";
  progressBar.style.width = "0%";

  const zip = new JSZip();
  const toDownload = records.filter(r => r.photo_path);
  let done = 0;

  try {
    for (const r of toDownload) {
      const url = getPublicUrl(r.photo_path);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`다운로드 실패: ${r.photo_path}`);
      const blob = await res.blob();
      // ZIP 내 파일명은 display_name (한글 포함) 사용
      const saveAs = r.photo_display_name || r.photo_path;
      zip.file(saveAs, blob);
      done++;
      progressBar.style.width = `${Math.round(done / toDownload.length * 100)}%`;
    }

    const blob = await zip.generateAsync({ type: "blob" });
    const y = document.getElementById("sel-year").value;
    const m = document.getElementById("sel-month").value;
    const mm = String(m).padStart(2, "0");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `드론사진_${y}${mm}.zip`;
    a.click();
  } catch(e) {
    alert("ZIP 생성 실패: " + e.message);
  }

  btn.disabled = false;
  btn.textContent = "📥 ZIP 다운로드";
  progressWrap.style.display = "none";
  updateBadge();
}

// 오늘 날짜로 월 자동 선택
const now = new Date();
document.getElementById("sel-year").value = String(now.getFullYear());
document.getElementById("sel-month").value = String(now.getMonth() + 1);

// 페이지 로드 시 2개월 이전 사진 자동 삭제
autoDeleteOldPhotos();
</script>
</body>
</html>
