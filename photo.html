<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드론 사진 파일명 변환</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f3f4f6;color:#111;padding:16px;}
  h1{font-size:18px;font-weight:bold;margin-bottom:4px;}
  .sub{font-size:12px;color:#666;margin-bottom:16px;}

  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px 16px;margin-bottom:14px;}
  .controls label{font-size:13px;font-weight:bold;}
  select{font-size:13px;padding:6px 10px;border:1px solid #ccc;border-radius:6px;}
  button{font-size:13px;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;}
  .btn-load{background:#1a5fb4;color:#fff;}
  .btn-zip{background:#16a34a;color:#fff;font-weight:bold;padding:10px 20px;}
  .btn-zip:disabled{background:#9ca3af;cursor:not-allowed;}

  .status{font-size:12px;color:#555;margin-left:4px;}

  .list{display:flex;flex-direction:column;gap:10px;}

  .card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .card-info{flex:1;min-width:180px;}
  .card-no{font-size:11px;color:#888;margin-bottom:2px;}
  .card-date{font-size:13px;font-weight:bold;color:#1a5fb4;}
  .card-loc{font-size:12px;color:#444;margin-top:2px;}
  .card-filename{font-size:11px;color:#16a34a;margin-top:4px;font-family:monospace;word-break:break-all;}

  .card-upload{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .upload-btn{background:#f3f4f6;border:1.5px dashed #aaa;border-radius:8px;padding:8px 14px;font-size:12px;color:#555;cursor:pointer;text-align:center;white-space:nowrap;}
  .upload-btn:hover{background:#e5e7eb;}
  input[type="file"]{display:none;}

  .thumb-wrap{position:relative;}
  .thumb{width:70px;height:70px;object-fit:cover;border-radius:6px;border:2px solid #16a34a;display:block;}
  .thumb-del{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}

  .upload-status{font-size:10px;margin-top:2px;max-width:80px;word-break:break-all;text-align:center;}
  .upload-status.uploading{color:#f59e0b;}
  .upload-status.done{color:#16a34a;}
  .upload-status.error{color:#dc2626;}

  /* 이미 업로드된 사진 표시 */
  .cloud-badge{font-size:10px;background:#dbeafe;color:#1a5fb4;border-radius:4px;padding:2px 6px;margin-top:2px;display:inline-block;}

  .empty{text-align:center;color:#999;padding:40px;font-size:13px;}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .count-badge{background:#1a5fb4;color:#fff;border-radius:20px;padding:3px 10px;font-size:12px;}

  .progress-bar-wrap{width:100%;background:#e5e7eb;border-radius:4px;height:6px;margin-top:4px;display:none;}
  .progress-bar{height:6px;background:#16a34a;border-radius:4px;width:0%;transition:width 0.3s;}
</style>
</head>
<body>

<h1>📷 드론 사진 파일명 변환</h1>
<p class="sub">사진을 선택하면 자동으로 파일명이 변환되어 클라우드에 저장됩니다. 다른 기기에서도 ZIP 다운로드가 가능합니다.</p>

<div class="controls">
  <label>월 선택</label>
  <select id="sel-year">
    <option value="2025">2025년</option>
    <option value="2026" selected>2026년</option>
    <option value="2027">2027년</option>
  </select>
  <select id="sel-month">
    <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
    <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
    <option value="7" selected>7월</option><option value="8">8월</option><option value="9">9월</option>
    <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
  </select>
  <button class="btn-load" onclick="loadRecords()">불러오기</button>
  <span class="status" id="loadMsg"></span>
</div>

<div class="bar" id="actionBar" style="display:none;">
  <span class="count-badge" id="countBadge">업로드 0 / 0</span>
  <button class="btn-zip" id="btnZip" onclick="downloadZip()">📥 ZIP 다운로드</button>
</div>
<div class="progress-bar-wrap" id="progressWrap">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="list" id="list">
  <div class="empty">위에서 월을 선택하고 불러오기를 누르세요.</div>
</div>

<script>
const SUPABASE_URL = "https://fnpsaypaxpxyyqmrqwai.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZucHNheXBheHB4eXlxbXJxd2FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5OTc1NzYsImV4cCI6MjA4OTU3MzU3Nn0.yZir2n-zxnbedVdIKwpqJAnWjuwEp96jIYjOY6cNPe4";
const T_FLIGHTLOG = "drone_flight_log";
const BUCKET = "drone-photos";

// recordId → 서버에 저장된 파일경로
const uploaded = {}; // { id: { path, filename } }
let records = [];
let filenames = [];

function getPhotoFilenames(recs) {
  const dateSeq = {};
  return recs.map(r => {
    const dateStr = r.log_datetime ? r.log_datetime.slice(0, 10) : "";
    const mmdd = dateStr.slice(5).replace("-", "");
    const loc = r.flight_location || "";
    dateSeq[dateStr] = (dateSeq[dateStr] || 0) + 1;
    return mmdd ? `${mmdd}.목포.${dateSeq[dateStr]}.${loc}` : `unknown.${r.id}`;
  });
}

async function loadRecords() {
  const y = document.getElementById("sel-year").value;
  const m = document.getElementById("sel-month").value;
  const mm = String(m).padStart(2, "0");
  const mInt = parseInt(m);
  const nextY = mInt === 12 ? String(parseInt(y) + 1) : y;
  const nextMm = mInt === 12 ? "01" : String(mInt + 1).padStart(2, "0");

  const msg = document.getElementById("loadMsg");
  msg.textContent = "불러오는 중...";

  try {
    // 비행 기록 불러오기
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${T_FLIGHTLOG}?log_datetime=gte.${y}-${mm}-01&log_datetime=lt.${nextY}-${nextMm}-01&select=id,log_datetime,flight_location,pilot_name&order=log_datetime.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) throw new Error(await res.text());
    records = await res.json();
    filenames = getPhotoFilenames(records);

    // 이미 업로드된 파일 목록 조회
    const folder = `${y}${mm}`;
    const listRes = await fetch(
      `${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ prefix: folder + "/", limit: 500 })
      }
    );
    let existingFiles = [];
    if (listRes.ok) {
      existingFiles = await listRes.json();
    }

    // 업로드 상태 초기화
    Object.keys(uploaded).forEach(k => delete uploaded[k]);
    for (const f of existingFiles) {
      // 파일명에서 record id 매칭 (파일명 기준)
      const fname = f.name; // e.g. "0728.목포.1.진도항_여객터미널.jpg"
      // filenames 배열에서 일치하는 것 찾기 (공백→_ 치환 후 비교)
      records.forEach((r, i) => {
        const safeBase = filenames[i].replace(/ /g, "_");
        if (fname.startsWith(safeBase + ".") || fname === safeBase) {
          uploaded[r.id] = { path: folder + "/" + fname, filename: filenames[i] + fname.slice(fname.lastIndexOf(".")) };
        }
      });
    }

    msg.textContent = `${records.length}건 로드됨 (업로드 ${Object.keys(uploaded).length}건)`;
    renderList();
  } catch(e) {
    msg.textContent = "실패: " + e.message;
  }
}

function renderList() {
  const list = document.getElementById("list");
  const bar = document.getElementById("actionBar");

  if (!records.length) {
    list.innerHTML = '<div class="empty">이 달의 비행 기록이 없습니다.</div>';
    bar.style.display = "none";
    return;
  }

  bar.style.display = "flex";

  list.innerHTML = records.map((r, i) => {
    const dt = r.log_datetime || "";
    const datePart = dt.slice(0, 10);
    const timePart = dt.includes("T") ? dt.slice(11, 16) : "";
    const loc = r.flight_location || "-";
    const fname = filenames[i];
    const isUploaded = !!uploaded[r.id];

    return `
    <div class="card" id="card-${r.id}">
      <div class="card-info">
        <div class="card-no">No.${i + 1} · ${r.pilot_name || ""}</div>
        <div class="card-date">${datePart}${timePart ? " " + timePart : ""}</div>
        <div class="card-loc">📍 ${loc}</div>
        <div class="card-filename">${fname}</div>
        ${isUploaded ? `<span class="cloud-badge">☁️ 업로드됨: ${uploaded[r.id].filename}</span>` : ""}
      </div>
      <div class="card-upload">
        <label class="upload-btn" for="file-${r.id}">${isUploaded ? "🔄 교체" : "📁 사진 선택"}</label>
        <input type="file" id="file-${r.id}" accept="image/*" data-id="${r.id}" data-idx="${i}" onchange="handleFile(this)">
        <div id="thumb-${r.id}">
          ${isUploaded ? `<img class="thumb" src="${getPublicUrl(uploaded[r.id].path)}" alt="${fname}" onerror="this.style.display='none'">` : ""}
        </div>
        <div class="upload-status done" id="ustatus-${r.id}">${isUploaded ? "업로드 완료" : ""}</div>
      </div>
    </div>`;
  }).join("");

  updateBadge();
}

function getPublicUrl(path) {
  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}

async function handleFile(input) {
  const id = input.dataset.id;
  const idx = parseInt(input.dataset.idx);
  const fname = filenames[idx];
  const file = input.files[0];
  if (!file) return;

  const ext = file.name.includes(".") ? "." + file.name.split(".").pop().toLowerCase() : ".jpg";
  const newName = fname + ext;
  const safeKey = newName.replace(/ /g, "_"); // Storage 키에 공백 불허

  const y = document.getElementById("sel-year").value;
  const m = document.getElementById("sel-month").value;
  const mm = String(m).padStart(2, "0");
  const folder = `${y}${mm}`;
  const storagePath = `${folder}/${safeKey}`;

  const statusEl = document.getElementById(`ustatus-${id}`);
  const thumbEl = document.getElementById(`thumb-${id}`);

  statusEl.textContent = "업로드 중...";
  statusEl.className = "upload-status uploading";

  try {
    // 기존 파일 삭제 후 업로드 (upsert)
    const uploadRes = await fetch(
      `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${storagePath}`,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": file.type || "image/jpeg",
          "x-upsert": "true"
        },
        body: file
      }
    );

    if (!uploadRes.ok) {
      const err = await uploadRes.text();
      throw new Error(err);
    }

    uploaded[id] = { path: storagePath, filename: newName };

    statusEl.textContent = "업로드 완료 ✓";
    statusEl.className = "upload-status done";

    // 썸네일 표시
    const url = URL.createObjectURL(file);
    thumbEl.innerHTML = `
      <div class="thumb-wrap">
        <img class="thumb" src="${url}" alt="${newName}">
        <button class="thumb-del" onclick="deleteFile('${id}','${storagePath}')" title="삭제">✕</button>
      </div>`;

    // 카드에 cloud badge 업데이트
    const card = document.getElementById(`card-${id}`);
    let badge = card.querySelector(".cloud-badge");
    if (!badge) {
      badge = document.createElement("span");
      badge.className = "cloud-badge";
      card.querySelector(".card-filename").after(badge);
    }
    badge.textContent = `☁️ 업로드됨: ${newName}`;

    updateBadge();
  } catch(e) {
    statusEl.textContent = "실패: " + e.message;
    statusEl.className = "upload-status error";
  }
}

async function deleteFile(id, path) {
  if (!confirm("이 사진을 삭제하시겠습니까?")) return;

  await fetch(
    `${SUPABASE_URL}/storage/v1/object/${BUCKET}`,
    {
      method: "DELETE",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ prefixes: [path] })
    }
  );

  delete uploaded[id];
  const thumbEl = document.getElementById(`thumb-${id}`);
  thumbEl.innerHTML = "";
  const statusEl = document.getElementById(`ustatus-${id}`);
  statusEl.textContent = "";
  const card = document.getElementById(`card-${id}`);
  const badge = card.querySelector(".cloud-badge");
  if (badge) badge.remove();
  updateBadge();
}

function updateBadge() {
  const total = records.length;
  const done = Object.keys(uploaded).length;
  document.getElementById("countBadge").textContent = `☁️ 업로드 ${done} / ${total}`;
  document.getElementById("btnZip").disabled = done === 0;
}

async function downloadZip() {
  const btn = document.getElementById("btnZip");
  const progressWrap = document.getElementById("progressWrap");
  const progressBar = document.getElementById("progressBar");

  btn.disabled = true;
  btn.textContent = "다운로드 중...";
  progressWrap.style.display = "block";
  progressBar.style.width = "0%";

  const zip = new JSZip();
  const entries = Object.values(uploaded);
  let done = 0;

  try {
    for (const { path, filename } of entries) {
      const url = getPublicUrl(path);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`다운로드 실패: ${filename}`);
      const blob = await res.blob();
      zip.file(filename, blob);
      done++;
      progressBar.style.width = `${Math.round(done / entries.length * 100)}%`;
    }

    const blob = await zip.generateAsync({ type: "blob" });
    const y = document.getElementById("sel-year").value;
    const m = document.getElementById("sel-month").value;
    const mm = String(m).padStart(2, "0");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `드론사진_${y}${mm}.zip`;
    a.click();
  } catch(e) {
    alert("ZIP 생성 실패: " + e.message);
  }

  btn.disabled = false;
  btn.textContent = "📥 ZIP 다운로드";
  progressWrap.style.display = "none";
}

// 오늘 날짜로 월 자동 선택
const now = new Date();
document.getElementById("sel-year").value = String(now.getFullYear());
document.getElementById("sel-month").value = String(now.getMonth() + 1);
</script>
</body>
</html>
